<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake in Python</title>
<meta name="description" content="Snake, written in Python and running in your browser with PyScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
<style>
:root{
  --bg:#f6f5f2; --text:#1c1b19; --muted:#6c675f; --card:#ffffff; --line:#e4e1da;
  --board:#eef3e6; --grid:rgba(0,0,0,.05); --snake:#3f8f4f; --head:#2a6b38; --food:#d9453b;
  --accent:#2f7d43; --bonus:#e0a100; --wall:rgba(0,0,0,.28);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121311; --text:#eeeae2; --muted:#9a958b; --card:#1b1c1a; --line:#2c2d2a;
    --board:#171a15; --grid:rgba(255,255,255,.05); --snake:#58b36a; --head:#8fe0a0; --food:#ff6a5e;
    --accent:#6fcf85; --bonus:#ffc933; --wall:rgba(255,255,255,.22);
  }
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Inter",system-ui,sans-serif; line-height:1.6;
  display:flex; flex-direction:column; align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  -webkit-user-select:none; user-select:none;
}
nav.games{display:flex; gap:6px; margin-bottom:6px}
nav.games a{color:var(--muted); text-decoration:none; padding:3px 16px; border-radius:99px; font-size:14px; border:1px solid transparent}
nav.games a:hover{color:var(--text)}
nav.games a.on{color:var(--text); background:var(--card); border-color:var(--line); font-weight:600}
h1{margin:8px 0 2px; font-size:28px}
.sub{margin:0 0 16px; color:var(--muted); font-size:14px; text-align:center}
.sub code{font-size:13px}
.stats{display:flex; gap:10px; margin-bottom:10px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 18px; text-align:center; min-width:86px}
.stat small{display:block; color:var(--muted); font-size:12px}
.stat b{font-size:22px}
.controls{display:flex; gap:8px; margin-bottom:12px}
.controls button{font:inherit; font-size:13px; color:var(--text); background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:4px 14px; cursor:pointer}
.controls button:hover:not(:disabled){border-color:var(--accent)}
.controls button:disabled{opacity:.45; cursor:not-allowed}

.stage{position:relative; width:min(480px,100%,max(240px,calc(100dvh - 300px))); aspect-ratio:1; border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.08)}
canvas{display:block; width:100%; height:100%; touch-action:none}
#overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; text-align:center; padding:20px; cursor:pointer;
  background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:blur(3px);
}
#overlay-title{font-size:30px; font-weight:700; color:var(--accent)}
#overlay-hint{white-space:pre-line; font-size:14px; color:var(--muted); max-width:300px}

.dpad{display:none; margin-top:16px; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,56px); gap:8px; direction:ltr}
.dpad button{
  font:inherit; font-size:22px; color:var(--text); background:var(--card); border:1px solid var(--line);
  border-radius:14px; touch-action:manipulation; cursor:pointer;
}
.dpad button:active{background:var(--accent); color:#fff}
.dpad .up{grid-column:2; grid-row:1}
.dpad .left{grid-column:1; grid-row:2}
.dpad .down{grid-column:2; grid-row:2}
.dpad .right{grid-column:3; grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}

.player{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:var(--muted)}
.player input{font:inherit; font-size:14px; width:170px; color:var(--text); background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:4px 12px; -webkit-user-select:text; user-select:text}
.player input:focus{outline:none; border-color:var(--accent)}
.player input:disabled{opacity:.5}

.history{width:min(480px,100%); margin-top:22px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
.history-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.history h2{font-size:16px; margin:0}
.history .tabs{display:flex; gap:6px}
.history .tabs button{font:inherit; font-size:12px; color:var(--muted); background:transparent; border:1px solid var(--line);
  border-radius:8px; padding:2px 10px; cursor:pointer}
.history .tabs button.on{color:var(--text); border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent)}
.history .tabs button:hover{border-color:var(--accent)}
.history table{width:100%; border-collapse:collapse; font-size:13.5px}
.history th{font-weight:500; color:var(--muted); font-size:12px; text-align:left; padding:2px 6px 6px}
.history td{padding:5px 6px; border-top:1px solid var(--line); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.history td:nth-child(1){width:28px; color:var(--muted)}
.history td:nth-child(3), .history th:nth-child(3){text-align:right; font-weight:600}
.history td:nth-child(4), .history td:nth-child(5){color:var(--muted)}
.history tr.me td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.history .note{margin:10px 0 0; font-size:12px; color:var(--muted)}
.history .note button{font:inherit; font-size:12px; color:var(--accent); background:none; border:0; padding:0; cursor:pointer}
.history .note button:hover{text-decoration:underline}

footer{margin-top:22px; color:var(--muted); font-size:13px; text-align:center}
footer a{color:var(--accent); text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<nav class="games" aria-label="Games">
  <a href="index.html" class="on" aria-current="page">Snake</a>
  <a href="chess.html">Chess</a>
</nav>
<h1>🐍 Snake</h1>
<p class="sub">Written in Python, running right here in your browser with <code>PyScript</code></p>

<div class="stats">
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Best</small><b id="best">0</b></div>
  <div class="stat"><small>Level</small><b id="level">1</b></div>
</div>
<div class="controls">
  <button id="mode" type="button">Mode: Walls</button>
  <button id="sound" type="button">Sound: On</button>
</div>
<div class="player">
  <label for="name">Player</label>
  <input id="name" type="text" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false">
</div>

<div class="stage">
  <canvas id="board"></canvas>
  <div id="overlay">
    <div id="overlay-title">Loading…</div>
    <div id="overlay-hint">Starting Python in your browser, this takes a few seconds</div>
  </div>
</div>

<div class="dpad">
  <button class="up" data-dir="up" aria-label="Up">▲</button>
  <button class="left" data-dir="left" aria-label="Left">◀</button>
  <button class="down" data-dir="down" aria-label="Down">▼</button>
  <button class="right" data-dir="right" aria-label="Right">▶</button>
</div>

<section class="history" aria-labelledby="log-title">
  <div class="history-head">
    <h2 id="log-title">Top scores</h2>
    <div class="tabs">
      <button id="tab-top" type="button" class="on">Top scores</button>
      <button id="tab-recent" type="button">Recent games</button>
    </div>
  </div>
  <table>
    <thead><tr><th>#</th><th>Player</th><th>Score</th><th>Mode</th><th>Date</th></tr></thead>
    <tbody id="log-body"></tbody>
  </table>
  <p class="note">Saved in this browser only. <button id="clear-log" type="button">Clear history</button></p>
</section>

<footer>
  <a href="game.py">View the Python source</a> ·
  <a href="https://github.com/yousefalami" target="_blank" rel="noopener">GitHub</a>
</footer>

<script type="py" src="./game.py"></script>
</body>
</html>
